  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#050E1A; --text:#E8F4FA; } }
:root[data-theme="dark"]{ --ink:#050E1A; --text:#E8F4FA; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; height:100%; background:var(--ink); color:var(--text); font-family:var(--body);
  font-size:clamp(14px, .9vw + .35vh, 24px); line-height:1.45; overflow:hidden; -webkit-user-select:none; user-select:none;
  background-image:
    radial-gradient(ellipse 55% 60% at 26% 52%, rgba(114,226,255,.10), transparent 70%),
    radial-gradient(ellipse 40% 40% at 90% 100%, rgba(229,40,47,.08), transparent 70%),
    linear-gradient(rgba(114,226,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(114,226,255,.03) 1px, transparent 1px);
  background-size:auto, auto, 48px 48px, 48px 48px;
}
button, select{ font:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--red-soft); outline-offset:3px; }

.app{ height:100%; display:grid; grid-template-rows:auto auto minmax(0,1fr) auto auto; }
.stripe{ height:4px; background:linear-gradient(90deg, var(--red) 0 38%, #fff 38% 42%, var(--blue) 42% 58%, #fff 58% 62%, var(--red) 62%); opacity:.9; }

header{ display:flex; justify-content:space-between; align-items:center; gap:1em; padding:1em 2em .4em; }
.brand{ display:flex; align-items:center; gap:1em; }
.plaque{ background:#fff; border-radius:4px 14px 4px 14px; padding:.45em .8em; display:flex; box-shadow:0 0 0 1px rgba(255,255,255,.1), 0 8px 24px rgba(0,0,0,.35); }
.plaque img{ height:2.3em; width:auto; display:block; }
.unit{ font-family:var(--display); font-weight:600; letter-spacing:.14em; font-size:.95em; border-left:3px solid var(--red); padding-left:.8em; line-height:1.15; }
.unit small{ display:block; font-weight:400; letter-spacing:.06em; color:var(--muted); font-size:.72em; }
.tools{ display:flex; gap:.5em; align-items:center; }
.tool{ background:transparent; border:1px solid var(--line); border-radius:6px; padding:.25em .6em; font-size:.62em; color:var(--muted); cursor:pointer; font-family:var(--display); }
select.tool{ background:var(--ink); max-width:14em; }
.clock{ color:var(--holo); font-family:var(--display); font-variant-numeric:tabular-nums; font-size:1.05em; margin-left:.4em; }

main{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:2vw; padding:0 3vw; min-height:0; }
.stage{ display:grid; place-items:center; min-height:0; }
.hud{ align-self:center; display:flex; flex-direction:column; gap:.8em; min-width:0; }
.hud-l{ align-items:flex-end; text-align:right; font-family:var(--display); }
.hud-r{ align-items:flex-start; }
.readout{ font-size:.7em; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); border-right:2px solid var(--line); padding-right:.8em; line-height:1.6; }
.readout b{ color:var(--holo); font-weight:500; }
body[data-state="listening"] .readout b.st{ color:var(--red-soft); }
.meter{ width:9em; height:4px; background:var(--line); border-radius:2px; overflow:hidden; }
.meter i{ display:block; height:100%; width:calc(var(--lvl,0) * 100%); background:var(--holo); }
body[data-state="listening"] .meter i{ background:var(--red-soft); }

/* ---------- The orb ---------- */
.orb{ position:relative; width:min(60vh, 46vw); aspect-ratio:1; cursor:pointer; background:none; border:0; padding:0; border-radius:50%; }
.orb > svg, .orb canvas{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.orb canvas{ pointer-events:none; }
.ring{ transform-origin:50% 50%; transform-box:view-box; }
.r1{ animation:spin 40s linear infinite; } .r2{ animation:spin 26s linear infinite reverse; }
.r3{ animation:spin 70s linear infinite; } .r4{ animation:spin 16s linear infinite reverse; }
.glow{ position:absolute; inset:14%; border-radius:50%; background:radial-gradient(circle, rgba(114,226,255,calc(.16 + var(--lvl,0) * .35)), transparent 65%); }
.ripple{ position:absolute; inset:22%; border-radius:50%; border:2px solid var(--red); opacity:0; }
.float{ position:absolute; inset:0; animation:hover 6s ease-in-out infinite; }
.mark{ position:absolute; left:50%; top:51%; width:30%; aspect-ratio:540/632; transform:translate(-50%,-50%) scale(calc(1 + var(--lvl,0) * .07));
  filter:drop-shadow(0 0 .5vmin rgba(114,226,255,.9)) drop-shadow(0 0 calc(2vmin + var(--lvl,0) * 4vmin) rgba(114,226,255,.5)); }
.mark i{ position:absolute; inset:0; -webkit-mask:var(--m) center/contain no-repeat; mask:var(--m) center/contain no-repeat; }
.m-body{ --m:var(--m-sil);
  background:repeating-linear-gradient(0deg, rgba(114,226,255,.22) 0 1px, transparent 1px 5px), linear-gradient(180deg, rgba(114,226,255,.14), rgba(61,95,196,.18)); }
.m-outline{ --m:var(--m-outline); background:var(--holo); }
.m-icon{ --m:var(--m-icon); background:linear-gradient(180deg, #fff 0%, #CFF6FF 35%, var(--holo) 70%, #3AA5CC 100%); overflow:hidden; }
.m-icon::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 0 44%, rgba(255,255,255,.95) 50%, transparent 56% 100%); background-size:100% 260%; animation:scan 3.4s linear infinite; mix-blend-mode:screen; }
.m-body::after{ content:""; position:absolute; inset:0; background:linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent); background-size:220% 100%; animation:sweep 5s ease-in-out infinite; }

body[data-state="speaking"] .r1{ animation-duration:12s; } body[data-state="speaking"] .r4{ animation-duration:5s; }
body[data-state="listening"] .mark{ filter:drop-shadow(0 0 .5vmin rgba(255,90,95,.95)) drop-shadow(0 0 calc(2vmin + var(--lvl,0) * 4vmin) rgba(229,40,47,.55)); }
body[data-state="listening"] .m-outline{ background:var(--red-soft); }
body[data-state="listening"] .m-icon{ background:linear-gradient(180deg, #fff 0%, #FFE3E4 40%, var(--red-soft) 100%); }
body[data-state="listening"] .glow{ background:radial-gradient(circle, rgba(229,40,47,calc(.18 + var(--lvl,0) * .35)), transparent 65%); }
body[data-state="listening"] .ripple{ animation:ripple 1.6s ease-out infinite; }
body[data-state="listening"] .r2 circle, body[data-state="listening"] .r2 path{ stroke:var(--red-soft); }
@keyframes spin{ to{ transform:rotate(360deg); } }
@keyframes hover{ 50%{ transform:translateY(-1.2%); } }
@keyframes scan{ from{ background-position:0 130%; } to{ background-position:0 -130%; } }
@keyframes sweep{ 0%,100%{ background-position:120% 0; } 50%{ background-position:-20% 0; } }
@keyframes ripple{ from{ opacity:.8; transform:scale(1); } to{ opacity:0; transform:scale(1.8); } }

/* ---------- Caption dock (small text under the orb) ---------- */
.dock{ display:flex; flex-direction:column; align-items:center; gap:.7em; padding:.4em 4vw 0; max-height:34vh; overflow-y:auto; text-align:center; }
.msg{ max-width:72ch; font-size:.9em; color:#C9DEEA; }
.msg p{ margin:0 0 .35em; } .msg p:last-child{ margin:0; }
.msg .lead{ font-family:var(--display); font-size:1.35em; line-height:1.2; font-weight:500; color:#fff; margin-bottom:.3em; }
.msg .next{ color:var(--holo); font-family:var(--display); font-weight:500; margin-top:.5em; }
.options{ display:flex; flex-wrap:wrap; justify-content:center; gap:.5em; max-width:62em; }
.opt{ display:flex; align-items:center; gap:.6em; text-align:left; background:rgba(11,26,43,.85); border:1px solid var(--line);
  padding:.55em 1em .55em .6em; border-radius:4px 12px 4px 12px; cursor:pointer; font-family:var(--display); font-weight:500; font-size:.85em; min-height:2.9em;
  transition:border-color .15s, background .15s; }
.opt:hover, .opt:active{ border-color:var(--holo); background:var(--panel-2); }
.opt .n{ flex:none; width:1.7em; height:1.7em; display:grid; place-items:center; border:1px solid var(--red); border-radius:50%; color:var(--red-soft); font-size:.8em; }
.opt.quiet{ background:transparent; }
.opt.flash{ border-color:var(--red-soft); background:#2A0F14; }
.heard{ font-style:italic; color:var(--muted); font-size:.8em; min-height:1.2em; }
.qr{ display:flex; flex-direction:column; gap:.6em; background:rgba(11,26,43,.85); border:1px solid var(--line); border-left:3px solid var(--red); padding:.9em; border-radius:4px 14px 4px 14px; max-width:15em; }
.qr .code{ width:clamp(130px, 11vw, 230px); aspect-ratio:1; flex:none; background:#fff; padding:6px; border-radius:6px; }
.qr .code svg{ display:block; width:100%; height:100%; }
.qr strong{ font-family:var(--display); display:block; font-size:.9em; margin-bottom:.15em; }
.qr span{ color:var(--muted); font-size:.68em; word-break:break-all; }

footer{ display:flex; justify-content:center; align-items:center; gap:1em; padding:.6em 2em 1.2em; color:var(--muted); font-size:.8em; }
.live{ display:flex; align-items:center; gap:.6em; }
.live i{ width:.7em; height:.7em; border-radius:50%; background:var(--holo-dim); }
body[data-state="listening"] .live{ color:var(--red-soft); }
body[data-state="listening"] .live i{ background:var(--red); animation:dot 1.4s ease-out infinite; }
@keyframes dot{ from{ box-shadow:0 0 0 0 rgba(229,40,47,.7); } to{ box-shadow:0 0 0 .7em rgba(229,40,47,0); } }
body[data-screen="attract"] footer{ visibility:hidden; }

.attract{ display:flex; flex-direction:column; align-items:center; }
.attract h1{ font-family:var(--display); font-weight:500; font-size:1.7em; line-height:1.1; margin:0 0 .25em; color:#fff; }
.attract h1 em{ font-style:normal; color:var(--red-soft); }
.attract p{ color:var(--muted); margin:0 0 .9em; font-size:.85em; max-width:56ch; }
.start{ background:var(--red); color:#fff; border:0; font-family:var(--display); font-weight:600; font-size:1em; padding:.7em 2.2em; border-radius:4px 16px 4px 16px; cursor:pointer; box-shadow:0 0 0 0 rgba(229,40,47,.6); animation:beckon 2.4s ease-out infinite; }
@keyframes beckon{ 70%,100%{ box-shadow:0 0 0 1em rgba(229,40,47,0); } }


/* ---------- Wayfinding map ---------- */
.readouts{ display:flex; flex-direction:column; align-items:flex-end; gap:.8em; }
.readouts[hidden]{ display:none; }
.mapcard{ width:clamp(220px, 20vw, 380px); background:rgba(11,26,43,.85); border:1px solid var(--line); border-right:3px solid var(--holo); border-radius:14px 4px 14px 4px; padding:.8em .9em; text-align:left; }
.mapcard .k{ font-family:var(--display); font-size:.62em; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
.mapcard strong{ display:block; font-family:var(--display); font-size:1em; color:#fff; margin:.1em 0 .1em; }
.mapcard em{ display:block; font-style:normal; font-size:.75em; color:var(--holo); margin-bottom:.5em; }
.plan{ width:100%; height:auto; display:block; overflow:visible; }
.plan-shell{ fill:rgba(114,226,255,.05); stroke:var(--holo); stroke-width:4; stroke-linejoin:round; opacity:.8; }
.plan-wall{ fill:none; stroke:var(--holo-dim); stroke-width:3; }
.plan-zone{ fill:rgba(114,226,255,.18); stroke:var(--holo-dim); stroke-width:2; }
.plan-label{ font-family:var(--display); font-size:24px; fill:var(--muted); }

.holo{ position:relative; background:linear-gradient(180deg, rgba(15,34,56,.82), rgba(8,20,34,.82)); border:1px solid var(--line); border-radius:4px 16px 4px 16px;
  padding:.75em .9em .8em; display:flex; flex-direction:column; min-height:0; overflow:hidden;
  box-shadow:inset 0 0 40px rgba(114,226,255,.05), 0 0 0 1px rgba(114,226,255,.04);
  animation:materialise .7s cubic-bezier(.2,.8,.2,1) both; }
.holo + .holo{ margin-top:.7em; }
.hud-r .holo, .hud-r .stats{ flex:none; }
.hud-r .stats + .holo{ margin-top:.7em; }
.holo.fill{ flex:1; }
.holo::before{ content:""; position:absolute; left:0; right:0; top:-30%; height:30%; pointer-events:none;
  background:linear-gradient(180deg, transparent, rgba(114,226,255,.10) 70%, rgba(114,226,255,.35) 98%, transparent);
  animation:sweepDown 1.1s ease-out .15s both; }
.holo::after{ content:""; position:absolute; top:.55em; right:.6em; width:.5em; height:.5em; border-top:2px solid var(--holo); border-right:2px solid var(--holo); opacity:.7; }
.holo h3{ margin:0 0 .45em; font-family:var(--display); font-weight:500; font-size:.66em; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); display:flex; gap:.6em; align-items:center; }
.holo h3::before{ content:""; width:1.6em; height:2px; background:var(--red); box-shadow:0 0 8px var(--red); flex:none; }

.holo .sub{ font-size:.66em; color:var(--muted); margin:-.25em 0 .5em; }
@keyframes materialise{ 0%{ opacity:0; clip-path:inset(0 0 100% 0); filter:brightness(2.2) blur(2px); } 40%{ opacity:.6; } 60%{ opacity:.35; } 100%{ opacity:1; clip-path:inset(0 0 0 0); filter:none; } }
@keyframes sweepDown{ from{ top:-30%; } to{ top:110%; } }
.hud-r .holo:nth-child(2){ animation-delay:.12s; } .hud-r .holo:nth-child(3){ animation-delay:.24s; } .hud-r .holo:nth-child(4){ animation-delay:.36s; }

.hsvg{ display:block; width:100%; height:100%; min-height:0; flex:1; overflow:visible; }
.hsvg text{ font-family:var(--display); fill:var(--muted); }
.draw{ stroke-dasharray:1; stroke-dashoffset:1; animation:drawIn 1.3s cubic-bezier(.4,.1,.2,1) .2s forwards; }
@keyframes drawIn{ to{ stroke-dashoffset:0; } }
.pop{ opacity:0; transform-box:fill-box; transform-origin:center; animation:pop .45s ease-out forwards; }
@keyframes pop{ 0%{ opacity:0; transform:scale(0); } 70%{ opacity:1; transform:scale(1.6); } 100%{ opacity:1; transform:scale(1); } }
.fadein{ opacity:0; animation:fadein .8s ease-out forwards; }
@keyframes fadein{ to{ opacity:1; } }

.rd-ring{ fill:none; stroke:rgba(114,226,255,.16); stroke-dasharray:2 5; }
.rd-ax{ stroke:rgba(114,226,255,.14); }
.rd-ax.on{ stroke:rgba(114,226,255,.6); }
.rd-rl{ font-size:11px; fill:#4E7F98 !important; }
.rd-lab{ font-size:14.5px; }
.rd-lab.on{ fill:#fff !important; font-weight:600; }
.rd-lab.pos{ fill:var(--holo) !important; font-weight:600; }
.rd-lab.neg{ fill:var(--red-soft) !important; font-weight:600; }
.rd-poly{ stroke-width:2.4; stroke-linejoin:round; filter:drop-shadow(0 0 6px currentColor); }
.legend{ display:flex; flex-wrap:wrap; gap:.3em 1.1em; font-size:.62em; color:var(--muted); margin-top:.35em; }
.legend i{ display:inline-block; width:1.4em; height:3px; vertical-align:middle; margin-right:.45em; border-radius:2px; }
.legend i.dash{ background:repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px) !important; height:2px; }

.hbars{ display:grid; gap:.42em; }
.hb{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.15em .6em; font-size:.72em; align-items:end; }
.hb b{ font-family:var(--display); font-weight:500; color:var(--holo); font-variant-numeric:tabular-nums; }
.hb .t{ grid-column:1/-1; height:.5em; background:repeating-linear-gradient(90deg, rgba(114,226,255,.10) 0 5px, transparent 5px 7px); }
.hb .t i{ display:block; height:100%; transform-origin:left; animation:grow 1.1s cubic-bezier(.3,.8,.2,1) both;
  background:repeating-linear-gradient(90deg, var(--c,#72E2FF) 0 5px, transparent 5px 7px); filter:drop-shadow(0 0 4px var(--c,#72E2FF)); }

.hm{ display:grid; gap:2px; font-size:.62em; }

[data-sk]{ cursor:pointer; }

body.warp::after{ content:""; position:fixed; inset:0; pointer-events:none; z-index:50;
  background:radial-gradient(circle at 50% 45%, rgba(114,226,255,.45), rgba(114,226,255,0) 45%), repeating-linear-gradient(0deg, rgba(114,226,255,.10) 0 2px, transparent 2px 5px);

@media (orientation:portrait), (max-width:1000px){

.ds span{ display:block; font-size:.6em; color:var(--muted); margin-top:.3em; max-width:12em; margin-left:auto; }
.tools{ position:relative; }
.aipanel{ position:absolute; top:calc(100% + .6em); right:0; z-index:70; width:min(24em, 90vw); padding:1em; background:rgba(8,20,34,.97); border:1px solid var(--holo-dim); border-radius:4px 14px 4px 14px; box-shadow:0 10px 40px rgba(0,0,0,.5), 0 0 30px rgba(114,226,255,.15); font-size:.7em; -webkit-user-select:text; user-select:text; }
.aipanel[hidden]{ display:none; }
.aipanel .k{ font-family:var(--display); letter-spacing:.2em; text-transform:uppercase; color:var(--holo); margin-bottom:.4em; }
.aipanel p{ margin:0 0 .7em; color:#C9DEEA; }
.aipanel input, .aipanel select{ width:100%; margin-bottom:.5em; font:inherit; font-size:1.05em; padding:.5em .7em; background:#050E1A; color:#fff; border:1px solid var(--line); border-radius:4px 10px 4px 10px; }
.aipanel .row{ display:flex; gap:.5em; }
.aipanel button{ font-family:var(--display); font-weight:600; background:var(--holo); color:var(--ink); border:0; border-radius:4px 10px 4px 10px; padding:.5em 1em; cursor:pointer; }
.aipanel button.ghost{ background:transparent; color:var(--muted); border:1px solid var(--line); }
.aipanel .note{ margin:.6em 0 0; color:var(--holo); }
body.thinking .r1{ animation-duration:2.5s !important; } body.thinking .r4{ animation-duration:1.6s !important; } body.thinking .r2{ animation-duration:4s !important; }
body.thinking .heard{ animation:think 1s ease-in-out infinite; color:var(--holo); }
@keyframes think{ 50%{ opacity:.35; } }
.askbox{ position:fixed; left:50%; bottom:calc(4vh + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:80; display:flex; gap:.5em; width:min(40em, 92vw); padding:.6em; background:rgba(8,20,34,.97); border:1px solid var(--holo); border-radius:4px 16px 4px 16px; box-shadow:0 0 40px rgba(114,226,255,.25); }
.askbox[hidden]{ display:none; }
.askbox input{ flex:1; min-width:0; font:inherit; font-size:.95em; padding:.5em .8em; background:#050E1A; color:#fff; border:1px solid var(--line); border-radius:4px 10px 4px 10px; -webkit-user-select:text; user-select:text; }
.askbox button{ font-family:var(--display); font-weight:600; background:var(--holo); color:var(--ink); border:0; border-radius:4px 10px 4px 10px; padding:.5em 1.2em; cursor:pointer; }
.sk-msg .lead.flashin{ animation:enter .45s ease-out both; }
/* chart engine: table format */
.dtab-wrap{ flex:1; min-height:0; overflow:auto; }
.dtab{ width:100%; border-collapse:separate; border-spacing:3px; font-size:.95em; }
.dtab th{ text-align:left; font-weight:500; color:#CFE6F2; padding:.35em .6em; white-space:nowrap; }
.dtab thead th{ text-align:center; font-size:.85em; letter-spacing:.06em; text-transform:uppercase; color:var(--holo,#72E2FF); }
.dtab td{ text-align:center; padding:.35em .6em; color:#fff; border-radius:4px; font-variant-numeric:tabular-nums; animation:fadein .6s ease-out both; }
/* respondent dots */
.dot-off{ fill:rgba(114,226,255,.16); opacity:0; animation:fadein .5s ease-out forwards; }
.dot-on{ fill:#FFD166; opacity:0; filter:drop-shadow(0 0 3px #FFD166); animation:popb .5s cubic-bezier(.2,.9,.3,1.2) forwards; transform-box:fill-box; transform-origin:center; }
.dkey{ display:inline-block; width:.7em; height:.7em; border-radius:50%; background:rgba(114,226,255,.25); margin-right:.35em; vertical-align:middle; }
.dkey.on{ background:#FFD166; box-shadow:0 0 6px #FFD166; }
/* quotes */
.qstage{ display:flex; flex-direction:column; gap:1.1em; flex:1; min-height:0; justify-content:center; padding:.4em .6em; }
.qbig{ position:relative; padding:1.4em 1.6em 1.2em; border-left:3px solid var(--red,#E5282F); background:linear-gradient(90deg,rgba(114,226,255,.08),transparent); border-radius:4px; }
.qbig .qtext{ font-size:clamp(1.15rem,2.1vw,2.1rem); line-height:1.35; color:#fff; margin:0 0 .6em; font-weight:300; }
.qbig .qtag, .qcard span{ font-size:.82em; letter-spacing:.12em; text-transform:uppercase; color:#72E2FF; }
.qstrip{ display:grid; grid-template-columns:repeat(3,1fr); gap:.8em; }
.qcard{ padding:.9em 1em; border:1px solid rgba(114,226,255,.18); border-radius:6px; background:rgba(8,20,34,.6); animation:fadein .8s ease-out both; }
.qcard p{ margin:0 0 .5em; color:#CFE6F2; font-size:.95em; line-height:1.35; }
.qin{ animation:qin .9s cubic-bezier(.2,.8,.2,1) both; }
@keyframes qin{ from{ opacity:0; transform:translateY(12px); filter:blur(4px); } to{ opacity:1; transform:none; filter:none; } }
.qstage.side .qbig .qtext{ font-size:1.05rem; }
.qstage.side .qstrip{ grid-template-columns:1fr; }
.qstage.side .qcard:nth-child(n+2){ display:none; }
.opt.clar{ border-color:#FFD166; color:#FFD166; }
/* live captions */
.sk-msg .lead.cap{ color:rgba(232,244,250,.42); font-weight:400; transition:color .2s; }
.sk-msg .lead.cap .said{ color:#fff; text-shadow:0 0 18px rgba(114,226,255,.35); }
/* spotlight as Carl speaks */
#mapBox .hsvg{ transition:transform 1.1s cubic-bezier(.2,.8,.2,1); }
#mapBox .holo, #mapBox .fill{ overflow:hidden; }
svg .spot{ filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 22px #72E2FF) brightness(1.35); }
.spotring{ fill:none; stroke:#fff; stroke-width:3; stroke-dasharray:6 6; animation:spotring 1.6s ease-in-out infinite; pointer-events:none; }
@keyframes spotring{ 0%,100%{ opacity:.95; stroke-width:3; } 50%{ opacity:.35; stroke-width:6; } }
.hb.spot, .sb.spot, .stat.spot, tr.spot, .chipx.spot{ background:rgba(114,226,255,.14); box-shadow:0 0 0 1px rgba(114,226,255,.6), 0 0 24px rgba(114,226,255,.35); border-radius:6px; transition:background .3s, box-shadow .3s; }
/* simple charts for reading across a room */
.sbars{ display:flex; flex-direction:column; justify-content:center; gap:clamp(8px,1.6vh,20px); flex:1; min-height:0; padding:.5em 1em; }
.sb{ display:grid; grid-template-columns:minmax(8em,44%) 1fr 4.2em; align-items:center; gap:1em; font-size:clamp(17px,1.9vw,34px); }
.sb .l{ color:#fff; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sb .t{ height:.9em; background:rgba(114,226,255,.08); border-radius:999px; overflow:hidden; }
.sb .t i{ display:block; height:100%; border-radius:999px; background:var(--c); box-shadow:0 0 14px var(--c); transform-origin:left; animation:growR 1s cubic-bezier(.2,.8,.2,1) both; }
.sb b{ color:var(--c); font-weight:600; text-align:right; font-variant-numeric:tabular-nums; }
.sgap{ text-align:center; color:#8FAEC2; letter-spacing:.4em; font-size:clamp(16px,1.6vw,28px); }
.simple text{ font-size:20px; }
svg .spot, .hb, .sb, .stat{ transition:filter .6s, background .6s, box-shadow .6s; }

/* spotlight without zooming: everything stays on screen, the rest just dims */
.hsvg > *{ transition:opacity .6s; }
.hsvg.spotting > *:not(.spot):not(.spot-anc):not(.spotring):not(defs){ opacity:.32; }
/* when a diagram is blown up, Carl moves to the corner so he's still visible */
body.zoom .orb{ position:fixed; right:2vw; bottom:2vh; width:min(15vmin,165px); z-index:42; animation:orbIn .6s cubic-bezier(.2,.8,.2,1) both; }
body.zoom .holo.zoomed{ bottom:calc(17vh + 1vmin); }
@keyframes orbIn{ from{ opacity:0; transform:scale(.4); } }
/* skills mode: only Carl's captions at the bottom */
body[data-mode="skills"] .sk-opts, body[data-mode="skills"] .sk-msg .bootline, body[data-mode="skills"] #heard{ display:none !important; }
body[data-mode="skills"] .sk-msg .lead.cap{ font-size:clamp(20px,1.9vw,36px); line-height:1.35; max-width:min(1500px,88vw); margin:0 auto; }
.orb #sphere{ position:absolute; inset:-6%; width:112%; height:112%; pointer-events:none; }
.orb .mark{ width:15% !important; opacity:.8; }
#viz{ opacity:.55; }
</style>

function afterWho(){ return (isStudent() && !ctx.name) ? "name" : "wait"; }
function acceptPending(){
  const { field, value, next } = ctx.pending;
  if (field === "person") ctx.person = { name:value, first:value };

  if (field === "capacity" && VIP_RE.test(value)) ctx.vip = true;
  ctx.tries[field] = 0;
  return next;
}
function escHtml(s){ return String(s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]); }

const ASK_OPTIONS = /\b(options|what can i say|what are my choices|choices|help me|what do i say|i can't see|i cannot see|read (them|it|the options)|list)\b/;
const ASK_REPEAT = /\b(repeat|say (that|it) again|pardon|come again|didn't hear)\b/;
function optionsSpoken(){
  const labels = (val(S[current].options) || []).filter(o => !o.hidden).map(o => o.label.split(" · ")[0]);
  if (!labels.length) return "";
  return "You can say: " + (labels.length > 1 ? labels.slice(0, -1).join(", ") + ", or " + labels[labels.length - 1] : labels[0]) + ".";
}
const WAKE = /\b(carl|karl|hello|hi|hey|hiya|good (morning|afternoon|evening)|salam|salaam|assalamu|marhaba|excuse me|help|assistant|start|begin|appointment|career)\b/i;

/* ---------- Voice ---------- */
let voice = null;
const rank = v => (/^en-GB/i.test(v.lang) ? 0 : 20) + (/natural|online|neural/i.test(v.name) ? 0 : /google/i.test(v.name) ? 3 : 6) + (/ryan|thomas|male|george|arthur|oliver|daniel/i.test(v.name) && !/female/i.test(v.name) ? -2 : /sonia|libby|maisie|female|hazel|susan|kate/i.test(v.name) ? 1 : 0);
function pickVoice(){
  const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)).sort((a,b) => rank(a) - rank(b));
  if (!vs.length) return;
  let saved = null; try { saved = localStorage.getItem("bue-voice"); } catch(_){}
  voice = vs.find(v => v.name === saved && saved.indexOf("carl:")<0) || vs[0];
  const sel = $("voiceSel"); sel.hidden = false;
  sel.innerHTML = vs.map(v => `<option ${v === voice ? "selected" : ""}>${v.name}</option>`).join("");
  sel.onchange = () => { voice = vs.find(v => v.name === sel.value); try { localStorage.setItem("bue-voice", voice.name); } catch(_){} speak(["Hello, this is how I sound."]); };
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } else $("voiceSel").hidden = true;
const clean = t => t.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, "")
  .replace(/\s*&\s*/g, " and ").replace(/(\d)\s*%/g, "$1 percent").replace(/\bvs\.?\s/gi, "versus ").replace(/\s*[·|]\s*/g, ", ")
  .replace(/\s*[—–]\s*/g, ", ").replace(/\(n=\d+\)/g, "").replace(/[()]/g, "").replace(/\bAI\b/g, "A.I.").replace(/\bCV\b/g, "C.V.").replace(/\bCVs\b/g, "C.V.s")
  .replace(/\bBAEPS\b/g, "Business").replace(/\bMasscom\b/gi, "Mass Communication").replace(/\be\.g\.\s*/gi, "for example, ").replace(/\bi\.e\.\s*/gi, "that is, ")
  .replace(/\b(\d)\.(\d)(\d)\b/g, "$1 point $2 $3").replace(/\b(\d)\.(\d)\b/g, "$1 point $2").replace(/\s+([,.!?;:])/g, "$1").replace(/,\s*,/g, ",")
  .replace(/\bthe BUE\b/gi, "The British University in Egypt").replace(/\bBUE\b/g, "British University in Egypt")
  .replace(/\s+/g, " ").trim();
function speak(lines){
  const token = ++speakToken;
  return new Promise(res => {
    if (!voiceOn || !("speechSynthesis" in window)) return res();
    speechSynthesis.cancel(); acceptIdxSpeak = (typeof seenIdx==="number"?seenIdx:0);
    const all = lines.map(x => String(x).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, "").replace(/\s+/g, " ").trim()).filter(Boolean).join(" ");
    // Speak in phrase-sized chunks: long enough to flow naturally, short enough that Chrome's voices never cut out
    const sents = all.match(/[^.!?]+(?:[.!?]+["”’]?(?=\s|$))?/g) || [], parts = [];

const esc = k => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const hit = (t, k) => new RegExp("\\b" + esc(k) + (k.length <= 4 ? "\\b" : "")).test(t);

function cleanFree(raw, field){
  let s = raw.trim().replace(/[.?!]+$/, "");

    ? /^(yes|yeah|hi|hello|ok|okay|sure|um+|uh+|so)?[, ]*(my name is|my name's|the name is|name's|i am|i'm|im|it's|it is|this is|call me)\s+/i
    : field === "person"
      ? /^(i'm |i am )?(here )?(to see|seeing|meeting|with|it's|it is)\s+/i
      : /^(i'm|i am|i work (at|for|with)|i'm from|i am from|from|we're from|representing)\s+/i;
  s = s.replace(lead, "").replace(/\s*(thank you|thanks|please)$/i, "").trim();
  if (field === "name" || field === "person") s = s.split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
  else s = s.charAt(0).toUpperCase() + s.slice(1);

}

function handleSpeech(alts){
  bump();
  const top = alts[0].toLowerCase().replace(/[’']/g, "'");
  if (current === "skills" || (!(S[current] && S[current].input) && SkillsHUD.trigger(top))) return SkillsHUD.ask(alts[0]);
  if (current === "attract"){ if (WAKE.test(top)) go("welcome"); return; }
  if (/\b(start again|start over|restart|begin again)\b/.test(top)){ resetCtx(); return go("welcome"); }
  const sc = S[current];
  if (!sc.input && (ASK_OPTIONS.test(top) || ASK_REPEAT.test(top))){
    stopListening(); const id = current;
    return listenAfter(speak([ASK_REPEAT.test(top) ? val(sc.say).join(" ") : optionsSpoken()]), id);
  }

  // Free-text capture (names, organisations)
  if (sc.input){
    const f = sc.input.field;
    if (sc.input.optional && /\b(skip|prefer not|rather not|no thanks|none|nothing)\b/.test(top)){ ctx[f] = ""; return go(sc.next()); }
    const v = cleanFree(alts[0], f);
    if (!v) return;
    if (f === "person"){ const m = TEAM.find(t => t.keys.some(k => hit(top, k))); if (m){ ctx.person = m; return go(sc.next()); } }
    ctx.pending = { field:f, value:v, from:current, next:sc.next() };
    return go("confirm");
  }

  const opts = val(sc.options) || [], visible = opts.filter(o => !o.hidden);
  for (const raw of alts){
    const t = raw.toLowerCase().replace(/[’']/g, "'");
    const m = t.match(/\b(?:option|number|choice)\s+(\w+)/) || t.trim().match(/^(\w+)$/);
    if (m && NUMS[m[1]] && visible[NUMS[m[1]] - 1]) return choose(visible[NUMS[m[1]] - 1]);
    if (isStudent() && current !== "menu" && /\b(main menu|go back)\b/.test(t)) return go("menu");
    if (ctx.audience && /\b(goodbye|bye|that's all|i'm finished|i'm done)\b/.test(t)) return go("finish");
    const ranked = opts.map((o, i) => [o, o.p ?? i + 10]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
    for (const o of ranked){ if (o.keys && o.keys.some(k => hit(t, k))) return choose(o); }
  }
  heardEl.textContent = "Sorry, I didn't catch that. Say an option, or touch it.";
  if (misses < 2){
    const line = misses++ === 0 ? "Sorry, I didn't catch that. " + optionsSpoken() : "Sorry, I still didn't catch that. You can also ask a member of our team for help.";
    stopListening(); const id = current; listenAfter(speak([line]), id);
  }
}

/* ---------- The orb moves with the voice ----------

  const [x, y] = z.at;
  const zones = Object.values(ZONES).map(o => `<circle class="plan-zone" cx="${o.at[0]}" cy="${o.at[1]}" r="12"/>`).join("");
  return `<div class="mapcard enter"><span class="k">Find your way</span><strong>${z.name}</strong><em>${z.where.charAt(0).toUpperCase() + z.where.slice(1)}</em>
    <svg class="plan" viewBox="60 300 860 640" aria-hidden="true">
      <path class="plan-shell" d="M88 430 A398 335 0 0 0 385 752 L385 925 L540 925 L540 752 A398 335 0 0 0 885 430 L650 430 L650 330 L320 330 L320 430 Z"/>
      <path class="plan-wall" d="M320 455 L650 455 M495 330 L495 455 M612 740 C700 700 760 650 800 590 M650 655 L690 740 M720 610 L770 690 M88 430 L215 430 M205 430 L205 470"/>
      ${zones}
      <path class="plan-route" d="${d}"/>
      <circle class="plan-pulse" cx="${x}" cy="${y}" r="18"/><circle class="plan-dest" cx="${x}" cy="${y}" r="16"/>

}
function statTiles(stats){
  return `<div class="stats">${stats.map(([n, l], i) => `<div class="stat enter" style="animation-delay:${i * 120}ms"><b data-to="${n}">${n}</b><span>${l}</span></div>`).join("")}</div>`;
}
function countUp(root){
  root.querySelectorAll("b[data-to]").forEach(b => {
    const raw = b.dataset.to, m = raw.match(/[\d,.]+/); if (!m) return;
    const target = parseFloat(m[0].replace(/,/g, "")), dec = (m[0].split(".")[1] || "").length, t0 = performance.now();
    const step = now => { const k = Math.min(1, (now - t0) / 1400), e = 1 - Math.pow(1 - k, 3);
      const v = (target * e).toFixed(dec); b.textContent = raw.replace(m[0], dec ? v : Number(v).toLocaleString("en-GB")); if (k < 1) requestAnimationFrame(step); };

/* ---------- Flow ---------- */
function setState(s, label){ document.body.dataset.state = s; if (label) statusEl.textContent = label; }
function bump(){ clearTimeout(idleTimer); if (current !== "attract" && current !== "skills") idleTimer = setTimeout(attract, CONFIG.idleSeconds * 1000); }

function choose(o){
  const btn = [...panel.querySelectorAll(".opt")].find(b => b._opt === o);
  if (btn) btn.classList.add("flash");
  if (o.set) Object.assign(ctx, val(o.set));
  const dest = val(o.go);
  setTimeout(() => go(dest), btn ? 220 : 0);
}

function go(id){
  const sc = S[id];
  if (!sc) return go(isStudent() ? "menu" : "welcome");   // technical problem: back to the main menu
  stopListening(); hush(); clearTimeout(endTimer);
  if (id !== current) misses = 0;
  current = id; visits[id] = (visits[id] || 0) + 1;
  document.body.dataset.screen = id; heardEl.textContent = ""; bump();
  if (sc.enter) sc.enter();

  // Side panels: map on the left, QR code or figures on the right
  const zone = val(sc.map);
  $("mapBox").innerHTML = zone ? mapCard(zone) : "";
  $("readouts").hidden = !!zone;
  const stats = val(sc.stats);
  $("side").innerHTML = sc.qr ? `<div class="qr enter"><div class="code">${QR[sc.qr.key]}</div><div><strong>${sc.qr.title}</strong><span>${sc.qr.sub}</span></div></div>` : stats ? statTiles(stats) : "";
  countUp($("side"));

  let html = `<div class="msg enter">${sc.badge ? val(sc.badge) : ""}${sc.lead ? `<p class="lead">${val(sc.lead)}</p>` : ""}${(val(sc.text) || []).map(p => `<p>${p}</p>`).join("")}</div>`;
  if (sc.input){
    html += `<div class="capture enter"><input id="free" autocomplete="off" placeholder="${escHtml(val(sc.input.placeholder))}" enterkeyhint="done">
      <button id="freeGo">Continue</button>${sc.input.optional ? `<button class="ghost" id="freeSkip">Skip</button>` : ""}</div>
      ${sc.input.note ? `<p class="note">${sc.input.note}</p>` : ""}`;
  }
  const opts = (val(sc.options) || []).filter(o => !o.hidden);
  if (opts.length) html += `<div class="options enter">` + opts.map((o, i) => `<button class="opt ${o.quiet ? "quiet" : ""}" data-i="${i}"><span class="n">${i + 1}</span>${o.label}</button>`).join("") + `</div>`;
  panel.innerHTML = html; $("dock").scrollTop = 0;
  panel.querySelectorAll(".opt").forEach(b => { b._opt = opts[+b.dataset.i]; b.onclick = () => { hush(); stopListening(); choose(b._opt); }; });

  if (sc.input){
    const inp = $("free"), f = sc.input.field;
    const submit = () => { const v = cleanFree(inp.value, f); if (!v) return inp.focus();
      hush(); stopListening();
      if (f === "person") ctx.person = { name:v, first:v }; else ctx[f] = v;
      if (f === "capacity" && VIP_RE.test(v)) ctx.vip = true;
      go(sc.next()); };
    $("freeGo").onclick = submit;
    inp.onkeydown = e => { e.stopPropagation(); if (e.key === "Enter") submit(); };
    inp.onfocus = () => { hush(); stopListening(); setState("idle", "Typing"); };
    if ($("freeSkip")) $("freeSkip").onclick = () => { ctx[f] = ""; go(sc.next()); };
  }

  const p = speak(val(sc.say) || []);
  if (sc.end) p.then(() => { if (current === id) endTimer = setTimeout(attract, sc.endAfter || 9000); });
  else listenAfter(p, id);
}

function attract(){
  document.body.dataset.mode = ""; delete document.body.dataset.view;
  const sb = document.getElementById("skillsBtn"); if (sb) sb.classList.remove("on");
  hush(); stopListening(); clearTimeout(idleTimer); clearTimeout(endTimer);
  current = "attract"; resetCtx(); visits = {}; misses = 0;
  document.body.dataset.screen = "attract"; setState("idle", "Waiting"); heardEl.textContent = "";
  $("side").innerHTML = ""; $("mapBox").innerHTML = ""; $("readouts").hidden = false;
  panel.innerHTML = `<div class="attract enter"><h1>Welcome to the <em>Career Centre</em></h1>
    <p>Just say <b>hello</b> to begin</p>
    <button class="start" id="startBtn">Start</button></div>`;
  $("startBtn").onclick = () => go("welcome");

}

/* ---------- Controls ---------- */
// No tap needed: listening starts straight away. If the browser is holding back the voice until

  if (e.key === "Escape") return current === "skills" ? SkillsHUD.escape() : attract();

});

/* plain-English helpers for the voice */
const rel = d => d>.15?"well above":d>.05?"above":d>=-.05?"right in line with":d>=-.15?"a little below":"well below";
function pw(p){ return p>=95?"almost all":p>=85?"nearly nine in ten":p>=78?"about four in five":p>=70?"nearly three quarters":p>=62?"about two thirds":p>=56?"well over half":p>=50?"just over half":p>=45?"just under half":p>=37?"about two in five":p>=30?"about a third":p>=20?"about a quarter":p>=14?"about one in six":p>=8?"about one in ten":"very few"; }

let st = {view:"overview", fac:"DEN", facs:["LAW","ENG"], skills:[], group:null, skill:"Communication", percFac:false, expFac:null, cl:"medical", cls:CLK.slice()};

/* ---------- building blocks ---------- */
function holo(title, body, cls=""){ const m=body.match(/data-kind="(\w+)"/), kind=m?m[1]:"text";
  return `<section class="holo ${cls}" data-kind="${kind}"><button class="zbtn" data-zoom="1" aria-label="Enlarge this diagram" title="Enlarge"></button><h3>${title}</h3>${body}</section>`; }
function tiles(arr){ return `<div class="stats">${arr.map(([n,l],i)=>`<div class="stat enter" style="animation-delay:${i*110}ms"><b data-to="${h(n)}">${h(n)}</b><span>${l}</span></div>`).join("")}</div>`; }
function legend(items){ return `<div class="legend">${items.map(([c,l,dash])=>`<span><i class="${dash?"dash":""}" style="background:${c};color:${c}"></i>${h(l)}</span>`).join("")}</div>`; }
function hbars(items, max, cls=""){
  return `<div class="hbars" data-kind="bars">${items.map((it,i)=>`<div class="hb ${it.cls||cls}" ${it.color?`style="--c:${it.color}"`:""}><span>${h(it.label)}</span><b>${it.text}</b><div class="t"><i style="width:${Math.max(1,it.v/max*100)}%;animation-delay:${.15+i*.06}s"></i></div></div>`).join("")}</div>`;
}
function wrap(label, max){
  const out=[]; let line="";
  label.split(/ +/).forEach(w=>{ if((line+" "+w).trim().length>max && line){ out.push(line); line=w; } else line=(line+" "+w).trim(); });
  if(line) out.push(line); return out;
}
const P = (r,a) => `${(r*Math.cos(a)).toFixed(1)} ${(r*Math.sin(a)).toFixed(1)}`;

/* 1. Radial bloom: 18 wedges radiating from a core */
function radialCore(values, o){
  const lo=o.lo??3, hi=o.hi??4.5, N=SK.length, small=!!o.small;
  const r0=small?66:92, R=small?150:226, step=2*Math.PI/N, gapA=step*.18;
  const rad = v => r0 + Math.max(.04, Math.min(1,(v-lo)/(hi-lo)))*(R-r0);
  let g = `<circle r="${R+4}" fill="none" stroke="rgba(114,226,255,.10)"/>`;
  for(let v=lo+.5; v<=hi+1e-9; v+=.5) g += `<circle r="${rad(v).toFixed(1)}" class="rd-ring"/>`;
  g += `<circle r="${r0-14}" fill="rgba(114,226,255,.05)"/><g class="spinr"><circle r="${r0-8}" fill="none" stroke="rgba(114,226,255,.4)" stroke-width="1.4" stroke-dasharray="3 8"/></g>`;
  SK.forEach((k,i)=>{
    const a0=-Math.PI/2+i*step+gapA/2, a1=a0+step-gapA, r=rad(values[k]), col=o.color(k), dim=o.hl&&!o.hl.includes(k);
    const go = o.click ? go_({view:"skill",skill:k,skills:[k],group:null}) : "";
    g += `<path d="M${P(r0,a0)} L${P(r,a0)} A${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${P(r,a1)} L${P(r0,a1)} A${r0} ${r0} 0 0 0 ${P(r0,a0)} Z" class="bloom wedge" style="fill:${col};fill-opacity:${dim?.12:.6};stroke:${col};stroke-opacity:${dim?.25:1};animation-delay:${(.1+i*.045).toFixed(2)}s;filter:drop-shadow(0 0 ${dim?0:6}px ${col})" ${go}><title>${h(k)}: ${f2(values[k])}</title></path>`;
    if(o.labels==="skills"){
      const am=(a0+a1)/2, c=Math.cos(am), s=Math.sin(am), lr=R+14, anchor=c>=0?"start":"end", dy=s>.7?13:s<-.7?-3:5;
      g += `<g ${go}><text x="${(c*lr).toFixed(1)}" y="${(s*lr+dy).toFixed(1)}" text-anchor="${anchor}" class="rd-lab ${o.cls?o.cls(k):""}">${h(sn(k))} <tspan class="rv" style="fill:${col}">${f2(values[k])}</tspan></text></g>`;
    }
  });
  if(o.labels==="groups"){
    let i0=0;
    GKEYS.forEach(gk=>{
      const n=GROUPS[gk].length, a0=-Math.PI/2+i0*step+.05, a1=-Math.PI/2+(i0+n)*step-.05, rr=R+11, on=o.hlg===gk;
      g += `<path d="M${P(rr,a0)} A${rr} ${rr} 0 ${(a1-a0)>Math.PI?1:0} 1 ${P(rr,a1)}" fill="none" stroke="${on?"#fff":"rgba(114,226,255,.5)"}" stroke-width="${on?3:1.6}"/>`;
      const am=(a0+a1)/2, c=Math.cos(am), s=Math.sin(am), lr=R+24, anchor=Math.abs(c)<.25?"middle":c>0?"start":"end", dy=s>.6?15:s<-.6?-3:5;
      g += `<text x="${(c*lr).toFixed(1)}" y="${(s*lr+dy).toFixed(1)}" text-anchor="${anchor}" font-size="15" style="fill:${on?"#fff":"#8FAEC2"}">${h(gk)}</text>`;
      i0+=n;
    });
  }
  return g + (o.center||"");
}
function radialBars(values, o){ return `<svg class="hsvg" data-kind="bloom" viewBox="-430 -284 860 568" preserveAspectRatio="xMidYMid meet">${radialCore(values,o)}</svg>`; }

/* 2. Race track: one glowing arc per faculty */
function raceArcs(rows, {lo=3, hi=4.6, ref=null, refLabel=""}={}){
  const n=rows.length, rIn=60, gap=n>10?17:22, sw=gap*.62, SW=270, rMax=rIn+(n-1)*gap;
  const sweep = v => Math.max(3, Math.min(1,(v-lo)/(hi-lo))*SW);
  const Pd = (r,deg) => P(r, deg*Math.PI/180);
  const arc = (r,s) => `M${Pd(r,-90)} A${r} ${r} 0 ${s>180?1:0} 1 ${Pd(r,-90+s)}`;
  let g = "";
  (hi-lo>3?[]:[lo,(lo+hi)/2,hi]).forEach(v=>{ const d=-90+sweep(v); g += `<line x1="${Pd(rIn-12,d).split(" ")[0]}" y1="${Pd(rIn-12,d).split(" ")[1]}" x2="${Pd(rMax+14,d).split(" ")[0]}" y2="${Pd(rMax+14,d).split(" ")[1]}" stroke="rgba(114,226,255,.10)" stroke-dasharray="2 5"/>`;
    const [tx,ty]=Pd(rMax+26,d).split(" "); g += `<text x="${tx}" y="${(+ty+4).toFixed(1)}" text-anchor="middle" font-size="12">${v.toFixed(1)}</text>`; });
  rows.forEach((row,i)=>{
    const r=rIn+(n-1-i)*gap, s=sweep(row.v);
    g += `<path d="${arc(r,SW)}" fill="none" stroke="rgba(114,226,255,.07)" stroke-width="${sw.toFixed(1)}" stroke-linecap="round"/>`;
    g += `<g ${row.go?go_(row.go):""}><path d="${arc(r,s)}" fill="none" stroke="${row.color}" stroke-width="${sw.toFixed(1)}" stroke-linecap="round" pathLength="1" class="draw" style="animation-delay:${(.1+i*.07).toFixed(2)}s;filter:drop-shadow(0 0 5px ${row.color})"><title>${h(row.label)}: ${f2(row.v)}</title></path>
      <text x="-12" y="${(-r+4.5).toFixed(1)}" text-anchor="end" font-size="13.5" style="fill:#CFE6F2">${h(row.label)}${row.note?` <tspan style="fill:#5F8BA3" font-size="11">${h(row.note)}</tspan>`:""} <tspan style="fill:${row.color}">${row.text??f2(row.v)}</tspan></text></g>`;
  });
  if(ref!=null){ const d=-90+sweep(ref), [x1,y1]=Pd(rIn-10,d).split(" "), [x2,y2]=Pd(rMax+12,d).split(" ");
    g += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${GOLD}" stroke-width="2" stroke-dasharray="6 4" class="fadein" style="animation-delay:1.3s;filter:drop-shadow(0 0 4px ${GOLD})"/>`; }
  g += `<circle r="${rIn-22}" fill="rgba(114,226,255,.05)" stroke="rgba(114,226,255,.3)" stroke-dasharray="2 6" class="spinr"/>`;
  const m=rMax+44;
  return `<svg class="hsvg" data-kind="arcs" viewBox="${-m} ${-m+10} ${2*m} ${2*m-10}" preserveAspectRatio="xMidYMid meet">${g}</svg>${ref!=null?legend([[GOLD,refLabel,true]]):""}`;
}

/* 3. Equaliser: LED columns per category, one per faculty */
function equalizer(cats, series, o={}){
  const W=760, H=500, L=44, R=10, T=34, B=52, base=H-B, uid=++UID;
  const all=series.flatMap(s=>cats.map(c=>s.values[c.key]));
  const lo=Math.min(3, Math.floor((Math.min(...all)-.2)*10)/10), hi=Math.max(4.5, Math.ceil((Math.max(...all)+.1)*10)/10);
  const y=v=>base-(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*(base-T);
  const gw=(W-L-R)/cats.length, k=series.length, bw=Math.min(cats.length===1?90:50, gw*.8/k);
  const defs=series.map((s,i)=>`<pattern id="led${uid}_${i}" width="8" height="7" patternUnits="userSpaceOnUse"><rect width="8" height="5" fill="${s.color}"/></pattern>`).join("");
  let g="";
  for(let v=Math.ceil(lo*2)/2; v<=hi+1e-9; v+=.5) g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(114,226,255,.10)" stroke-dasharray="2 5"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="12">${v.toFixed(1)}</text>`;
  g+=`<line x1="${L}" x2="${W-R}" y1="${base}" y2="${base}" stroke="rgba(114,226,255,.45)"/>`;
  cats.forEach((c,ci)=>{
    const gx=L+ci*gw+(gw-bw*k)/2;
    series.forEach((s,si)=>{
      const v=s.values[c.key], x=gx+si*bw, yy=y(v), d=(.1+ci*.12+si*.05), fsz=bw>=28?12:10;
      g+=`<g ${s.go?go_(s.go):""}><rect x="${(x+2).toFixed(1)}" y="${yy.toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${(base-yy).toFixed(1)}" fill="url(#led${uid}_${si})" class="rise" style="animation-delay:${d.toFixed(2)}s;filter:drop-shadow(0 0 4px ${s.color})"><title>${h(s.name)} · ${h(c.label)}: ${f2(v)}</title></rect>
        <rect x="${(x+2).toFixed(1)}" y="${(yy-3).toFixed(1)}" width="${(bw-4).toFixed(1)}" height="3" fill="#fff" class="fadein" style="animation-delay:${(d+.8).toFixed(2)}s"/>
        <text x="${(x+bw/2).toFixed(1)}" y="${(yy-8).toFixed(1)}" text-anchor="middle" font-size="${fsz}" class="fadein" style="fill:${s.color};animation-delay:${(d+.8).toFixed(2)}s">${f2(v)}</text></g>`;
    });
    if(o.refs){ const ry=y(o.refs[c.key]); g+=`<line x1="${(gx-4).toFixed(1)}" x2="${(gx+bw*k+4).toFixed(1)}" y1="${ry.toFixed(1)}" y2="${ry.toFixed(1)}" stroke="${GOLD}" stroke-width="2" stroke-dasharray="6 4" class="fadein" style="animation-delay:1.3s"/>`; }
    g+=`<text x="${(L+ci*gw+gw/2).toFixed(1)}" y="${base+26}" text-anchor="middle" font-size="14.5" style="fill:#CFE6F2">${h(c.label)}</text>`;
  });
  return `<svg class="hsvg ${o.fixed?"fixed":""}" data-kind="columns" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><defs>${defs}</defs>${g}</svg>` + legend(series.map(s=>[s.color,s.name]).concat(o.refs?[[GOLD,"All BUE students",true]]:[]));
}

/* 4. Orbit: faculties circling their cluster, linked by pulsing spokes */
function orbit(cl, valOf, ref, cavg, big=false){
  const codes=cl.codes, n=codes.length, Ro=big?205:140, rc=big?92:72, maxN=Math.max(...codes.map(c=>F[c].n)), k=big?1.45:1;
  let pl="", sp="";
  codes.forEach((c,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/n, x=Ro*Math.cos(a), y=Ro*Math.sin(a), r=(22+Math.sqrt(F[c].n/maxN)*18)*k, v=valOf(c), col=v>=ref?HOLO:RED;
    sp+=`<line x1="${(rc*Math.cos(a)).toFixed(1)}" y1="${(rc*Math.sin(a)).toFixed(1)}" x2="${((Ro-r)*Math.cos(a)).toFixed(1)}" y2="${((Ro-r)*Math.sin(a)).toFixed(1)}" stroke="${col}" stroke-opacity=".55" stroke-width="2" stroke-dasharray="3 9" class="flow" style="animation-delay:-${i*.4}s"/>`;
    pl+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><g class="counter" ${go_({view:"faculty",fac:c,skills:st.skills,group:st.group})}><g class="popb" style="animation-delay:${(.2+i*.15).toFixed(2)}s"><circle r="${r.toFixed(1)}" fill="${col}" fill-opacity=".14" stroke="${col}" stroke-width="2" style="filter:drop-shadow(0 0 ${big?14:8}px ${col})"><title>${h(fname(c))}: ${f2(v)} (${F[c].n} students)</title></circle><circle r="${(r*.82).toFixed(1)}" fill="none" stroke="${col}" stroke-opacity=".3" stroke-dasharray="2 6" class="spinb"/><text y="${(-3*k).toFixed(1)}" text-anchor="middle" font-size="${(12*k).toFixed(1)}" style="fill:#fff">${h(fab(c))}</text><text y="${(14*k).toFixed(1)}" text-anchor="middle" font-size="${(13*k).toFixed(1)}" style="fill:${col}">${f2(v)}</text>${big&&F[c].n<SMALL?`<text y="${(r+18).toFixed(1)}" text-anchor="middle" font-size="12" style="fill:#8FAEC2">${F[c].n} students</text>`:""}</g></g></g>`;
  });
  const V0=Ro+(big?60:48);
  return `<svg class="hsvg ${big?"":"fixed"}" data-kind="orbit" viewBox="${-V0} ${-V0} ${2*V0} ${2*V0}" ${big?"":'style="max-height:36vh"'}>
    <g class="spinr"><circle r="${Ro+(big?44:46)}" fill="none" stroke="rgba(114,226,255,.4)" stroke-dasharray="1 9" stroke-width="2"/></g>
    <g class="spinr" style="animation-direction:reverse;animation-duration:50s"><circle r="${rc+16}" fill="none" stroke="${cl.color}" stroke-opacity=".5" stroke-dasharray="20 14" stroke-width="1.4"/></g>
    <circle r="${Ro}" fill="none" stroke="rgba(114,226,255,.2)" stroke-dasharray="4 6"/>
    <circle r="${rc}" fill="rgba(114,226,255,.06)" stroke="${cl.color}" stroke-width="1.8" style="filter:drop-shadow(0 0 18px ${cl.color})"/>
    <text y="${big?-24:-16}" text-anchor="middle" font-size="${big?14:11}" letter-spacing="1.5" style="fill:${cl.color}">${h(cl.short.toUpperCase())}</text>
    <text y="${big?22:18}" text-anchor="middle" font-size="${big?46:32}" style="fill:#fff">${f2(cavg)}</text>
    <text y="${big?46:38}" text-anchor="middle" font-size="${big?12:10.5}" style="fill:#8FAEC2">cluster average</text>
    <g class="orbit-spin">${sp}${pl}</g></svg>${legend([[HOLO,"Above BUE average"],[RED,"Below"]])}`;
}

/* 4b. Galaxy: every faculty linked to the university core, green = strongest, red = weakest */
const hx=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));
function lerp3(t){ const [a,b]= t<.5?[hx(RED),hx(GOLD)]:[hx(GOLD),hx(GREEN)], u=t<.5?t*2:(t-.5)*2; return "#"+a.map((x,i)=>Math.round(x+(b[i]-x)*u).toString(16).padStart(2,"0")).join(""); }
function galaxy(valOf, centerLabel){
  const order=[...CL.medical.codes, ...CL.engineering.codes, ...CL.social.codes];
  const vals=order.map(valOf), lo=Math.min(...vals), hi=Math.max(...vals), col=v=>lerp3((v-lo)/((hi-lo)||1));
  const RX=345, RY=285, maxN=Math.max(...CODES.map(c=>F[c].n)), step=2*Math.PI/16, rc=82, MID={medical:-Math.PI/2, engineering:Math.PI/6, social:5*Math.PI/6};
  const angOf=c=>{ const q=CLK.find(q=>CL[q].codes.includes(c)), cs=CL[q].codes, i=cs.indexOf(c); return MID[q]+(i-(cs.length-1)/2)*step; };
  let g=`<ellipse rx="${RX}" ry="${RY}" fill="none" stroke="rgba(114,226,255,.14)" stroke-dasharray="3 7"/>`, nodes="", idx=0, sectors="";
  CLK.forEach(q=>{ const am=MID[q];
    sectors+=`<text x="${(190*Math.cos(am)).toFixed(1)}" y="${(160*Math.sin(am)+4).toFixed(1)}" text-anchor="middle" font-size="13" letter-spacing="3" style="fill:${CL[q].color};opacity:.75">${h(CL[q].short.toUpperCase())}</text>`; });
  CLK.forEach(q=>{ CL[q].codes.forEach(c=>{
    const a=angOf(c), x=RX*Math.cos(a), y=RY*Math.sin(a), v=valOf(c), cc=col(v), r=20+Math.sqrt(F[c].n/maxN)*40, i=order.indexOf(c), d=Math.hypot(x,y);
    const ex=x*(1-r/d), ey=y*(1-r/d), sx=x*rc/d, sy=y*rc/d;
    g+=`<line x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${cc}" stroke-opacity=".7" stroke-width="${(1.4+2.6*(v-lo)/((hi-lo)||1)).toFixed(1)}" stroke-dasharray="3 10" class="flow" style="animation-delay:-${(i*.37).toFixed(2)}s;filter:drop-shadow(0 0 4px ${cc})"/>`;
    const inside=r>=38;
    nodes+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" ${go_({view:"faculty",fac:c,skills:st.skills,group:st.group})}><g class="bob" style="animation-delay:-${(i*.8).toFixed(1)}s;animation-duration:${(5+i%4).toFixed(1)}s"><g class="popb" style="animation-delay:${(.2+i*.08).toFixed(2)}s">
      <circle r="${(r+9).toFixed(1)}" fill="none" stroke="${cc}" stroke-opacity=".25" class="ping" style="animation-delay:${(i*.3%2.6).toFixed(2)}s"/>
      <circle r="${r.toFixed(1)}" fill="${cc}" fill-opacity=".2" stroke="${cc}" stroke-width="2.4" style="filter:drop-shadow(0 0 12px ${cc})"><title>${h(fname(c))}: ${f2(v)} (${F[c].n} students)</title></circle>
      ${inside?`<text y="-4" text-anchor="middle" font-size="14" style="fill:#fff">${h(fab(c))}</text><text y="17" text-anchor="middle" font-size="18" style="fill:${cc}">${f2(v)}</text>`
        :`<text y="6" text-anchor="middle" font-size="15" style="fill:${cc}">${f2(v)}</text><text y="${(r+18).toFixed(1)}" text-anchor="middle" font-size="13" style="fill:#fff">${h(fab(c))}${F[c].n<SMALL?` <tspan style="fill:#8FAEC2" font-size="10.5">n=${F[c].n}</tspan>`:""}</text>`}
    </g></g></g>`;
  }); });
  const core=`<g class="spinr"><circle r="${rc+22}" fill="none" stroke="rgba(114,226,255,.45)" stroke-dasharray="2 9" stroke-width="2"/></g>
    <g class="spinr" style="animation-direction:reverse;animation-duration:45s"><circle r="${rc+10}" fill="none" stroke="${HOLO}" stroke-opacity=".6" stroke-dasharray="30 18" stroke-width="1.5"/></g>
    <circle r="${rc}" fill="rgba(114,226,255,.08)" stroke="${HOLO}" stroke-width="2" style="filter:drop-shadow(0 0 22px ${HOLO})"/>
    <text y="-26" text-anchor="middle" font-size="14" letter-spacing="4" style="fill:${HOLO}">BUE</text>
    <text y="16" text-anchor="middle" font-size="40" style="fill:#fff">${f2(centerLabel.v)}</text>
    <text y="38" text-anchor="middle" font-size="11" style="fill:#8FAEC2">${h(centerLabel.t)}</text>`;
  return `<svg class="hsvg" data-kind="galaxy" viewBox="-500 -395 1000 790" preserveAspectRatio="xMidYMid meet">${sectors}${g}${core}${nodes}</svg>
    <div class="hscale"><span>${f2(lo)} lowest</span><span class="g gal"></span><span>${f2(hi)} highest</span><span>· bubble size = number of students · tap a faculty to open it</span></div>`;
}

/* 5. Three small blooms side by side for cluster vs cluster */
function clusterMinis(keys, fs, hl){
  const pos = keys.length===3 ? [[-280,-212],[280,-212],[0,212]] : [[-280,0],[280,0]];
  const vb = keys.length===3 ? "-560 -424 1120 848" : "-560 -212 1120 424";
  let g="";
  keys.forEach((q,i)=>{
    const c=CL[q], avg=gm(c.means, fs||SK);
    const nl=c.short.toUpperCase().split(" ");
    const center=nl.map((l,j)=>`<text y="${-18-(nl.length-1)*12+j*12}" text-anchor="middle" font-size="10" letter-spacing="1" style="fill:${c.color}">${h(l)}</text>`).join("")+`<text y="20" text-anchor="middle" font-size="34" style="fill:#fff">${f2(avg)}</text><text y="40" text-anchor="middle" font-size="11" style="fill:#8FAEC2">${c.n} students</text>`;
    g += `<svg x="${pos[i][0]-270}" y="${pos[i][1]-200}" width="540" height="400" viewBox="-270 -200 540 400" overflow="visible">${radialCore(c.means,{small:true,color:()=>c.color,labels:"groups",hl:hl||fs,hlg:st.group,center})}</svg>`;
  });
  return `<svg class="hsvg" data-kind="minis" viewBox="${vb}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

/* 6. Dot rows: one row per skill group, a glowing dot per cluster */
function dotRows(rows, keys){
  const all=rows.flatMap(r=>keys.map(q=>r.vals[q]));
  const lo=Math.floor((Math.min(...all)-.05)*10)/10, hi=Math.ceil((Math.max(...all)+.05)*10)/10;
  const LW=140, W=540, RH=38, top=8, H=top+rows.length*RH+26, x=v=>LW+(v-lo)/(hi-lo)*(W-LW-18);
  const stp = hi-lo>.7 ? .2 : .1;
  let g="";
  for(let v=Math.ceil(lo/stp)*stp; v<=hi+1e-9; v+=stp) g+=`<line x1="${x(v)}" x2="${x(v)}" y1="${top}" y2="${H-22}" stroke="rgba(114,226,255,.10)" stroke-dasharray="2 4"/><text x="${x(v)}" y="${H-6}" text-anchor="middle" font-size="12">${v.toFixed(1)}</text>`;
  rows.forEach((r,i)=>{
    const y=top+i*RH+RH/2, vs=keys.map(q=>r.vals[q]), lead=keys[vs.indexOf(Math.max(...vs))];
    g+=`<text x="${LW-12}" y="${y+5}" text-anchor="end" font-size="14" style="fill:#CFE6F2">${h(r.label)}</text><line x1="${x(Math.min(...vs))}" x2="${x(Math.max(...vs))}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.25)" stroke-width="2"/>`;
    keys.forEach((q,qi)=>{ g+=`<circle cx="${x(r.vals[q]).toFixed(1)}" cy="${y}" r="${q===lead?8:6}" fill="${CL[q].color}" class="popb" style="animation-delay:${(.3+i*.08+qi*.05).toFixed(2)}s;filter:drop-shadow(0 0 6px ${CL[q].color})"><title>${h(CL[q].short)} · ${h(r.label)}: ${f2(r.vals[q])}</title></circle>`; });
  });
  return `<svg class="hsvg fixed" data-kind="dots" viewBox="0 0 ${W} ${H}">${g}</svg>` + legend(keys.map(q=>[CL[q].color,CL[q].short]));
}

/* 7. Floating bubbles for what students ask for */
function bubbles(items){
  const rs=items.map(it=>24+Math.sqrt(it.size??it.v)*5), pos=[];
  rs.forEach((r,i)=>{ if(!i){ pos.push([0,0]); return; }
    for(let k=1;k<8000;k++){ const a=k*.23, d=k*.45, x=Math.cos(a)*d*1.12, y=Math.sin(a)*d*.95;
      if(pos.every((p,j)=>Math.hypot(p[0]-x,p[1]-y)>=rs[j]+r+10)){ pos.push([x,y]); break; } } });
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  pos.forEach((p,i)=>{ x0=Math.min(x0,p[0]-rs[i]); x1=Math.max(x1,p[0]+rs[i]); y0=Math.min(y0,p[1]-rs[i]); y1=Math.max(y1,p[1]+rs[i]); });
  let g="";
  items.forEach((it,i)=>{
    const r=rs[i], fz=Math.max(11,Math.min(19,r/5)), lines=wrap(it.label.replace(/ \(general\)/,"").replace(/ & /g," &\u00A0"), Math.max(7,Math.round(r*1.55/fz))), col=it.color;
    const top=-1.95*fz, bottom=.65*fz+(lines.length-1)*1.15*fz+.25*fz, sh=-(top+bottom)/2;
    g+=`<g transform="translate(${pos[i][0].toFixed(1)} ${pos[i][1].toFixed(1)})"><g class="bob" style="animation-delay:-${(i*.9).toFixed(1)}s;animation-duration:${(5+i%4*1.3).toFixed(1)}s"><g class="popb" style="animation-delay:${(.1+i*.09).toFixed(2)}s">
      <circle r="${r.toFixed(1)}" fill="${col}" fill-opacity=".12" stroke="${col}" stroke-width="1.6" style="filter:drop-shadow(0 0 10px ${col})"><title>${h(it.label)}: ${it.text??it.v+" students"}</title></circle>
      <circle r="${(r*.86).toFixed(1)}" fill="none" stroke="${col}" stroke-opacity=".3" stroke-dasharray="2 6" class="spinb" style="animation-duration:${20+i*3}s"/>
      <text y="${(-.7*fz+sh).toFixed(1)}" text-anchor="middle" font-size="${(fz*1.7).toFixed(1)}" style="fill:#fff">${it.text??it.v}</text>
      ${lines.map((l,j)=>`<text y="${(.65*fz+j*1.15*fz+sh).toFixed(1)}" text-anchor="middle" font-size="${fz.toFixed(1)}" style="fill:${col}">${h(l)}</text>`).join("")}
    </g></g></g>`;
  });
  const m=14;
  return `<svg class="hsvg" data-kind="bubbles" viewBox="${(x0-m).toFixed(0)} ${(y0-m).toFixed(0)} ${(x1-x0+2*m).toFixed(0)} ${(y1-y0+2*m).toFixed(0)}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

/* 8. Switchboard: which faculty asked for which kind of support */
function switchboard(){
  const {want}=needsData(), areas=want.map(w=>w[0]), N=FORM_CODES.length;
  const LW=190, CW=58, RH=34, TOP=240, W=LW+areas.length*CW+175, H=TOP+N*RH+14;
  let g="";
  areas.forEach((a,j)=>{
    const x=LW+j*CW+CW/2, n=want[j][1], bh=n/N*46;
    g+=`<line x1="${x}" x2="${x}" y1="${TOP}" y2="${H-8}" stroke="rgba(114,226,255,.07)"/>
      <rect x="${x-10}" y="${(TOP-14-bh).toFixed(1)}" width="20" height="${bh.toFixed(1)}" fill="${HOLO}" fill-opacity=".75" class="rise" style="animation-delay:${(.1+j*.06).toFixed(2)}s;filter:drop-shadow(0 0 5px ${HOLO})"/>
      <text x="${x}" y="${(TOP-20-bh).toFixed(1)}" text-anchor="middle" font-size="13" style="fill:${HOLO}">${n}</text>
      <text transform="translate(${x-4} ${TOP-84}) rotate(-35)" font-size="14" style="fill:#CFE6F2">${h(a)}</text>`;
  });
  FORM_CODES.forEach((c,i)=>{
    const y=TOP+i*RH+RH/2, w=new Set(F[c].form.wantMore);
    g+=`<g ${go_({view:"faculty",fac:c})}><text x="${LW-14}" y="${y+5}" text-anchor="end" font-size="14.5" style="fill:#CFE6F2">${h(fs_(c))}</text></g><line x1="${LW}" x2="${LW+areas.length*CW}" y1="${y}" y2="${y}" stroke="rgba(114,226,255,.08)"/>`;
    areas.forEach((a,j)=>{ const x=LW+j*CW+CW/2;
      g += w.has(a)
        ? `<circle cx="${x}" cy="${y}" r="7.5" fill="${HOLO}" class="popb" style="animation-delay:${(.2+i*.05+j*.03).toFixed(2)}s;filter:drop-shadow(0 0 6px ${HOLO})"><title>${h(fname(c))}: wants more ${h(a.toLowerCase())}</title></circle><circle cx="${x}" cy="${y}" r="7.5" stroke="${HOLO}" class="ping" style="animation-delay:${(((i*7+j*3)%13)/5).toFixed(2)}s"/>`
        : `<circle cx="${x}" cy="${y}" r="2.5" fill="rgba(114,226,255,.22)"/>`;
    });
  });
  return `<svg class="hsvg" data-kind="switch" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

/* 9. Diverging bars: students minus staff */
function diverging(data, fs){
  const LW=180, W=690, RH=30, top=40, cx=LW+130, k=(W-64-cx)/.8, H=top+data.length*RH+8;
  let g=`<text x="${cx-12}" y="18" text-anchor="end" font-size="12" letter-spacing="1.5" style="fill:${RED}">◀ STAFF HIGHER</text><text x="${cx+12}" y="18" font-size="12" letter-spacing="1.5" style="fill:${HOLO}">STUDENTS HIGHER ▶</text>`;
  [-.2,.2,.4,.6,.8].forEach(v=>{ const x=cx+v*k; g+=`<line x1="${x}" x2="${x}" y1="${top-6}" y2="${H}" stroke="rgba(114,226,255,.09)" stroke-dasharray="2 5"/>`; });
  g+=`<line x1="${cx}" x2="${cx}" y1="${top-10}" y2="${H}" stroke="#fff" stroke-opacity=".55" stroke-width="1.5" style="filter:drop-shadow(0 0 4px #fff)"/>`;
  data.forEach((d,i)=>{
    const y=top+i*RH+RH/2, on=fs&&fs.includes(d.k), w=Math.max(2,Math.min(Math.abs(d.d),.8)*k), pos=d.d>=0, col=pos?HOLO:RED, x=pos?cx:cx-w;
    g+=`<g style="opacity:${fs&&!on?.32:1}"><text x="${LW-12}" y="${y+5}" text-anchor="end" font-size="14" style="fill:${on?"#fff":"#B9D3E2"}">${h(sn(d.k))}</text>
      <rect x="${x.toFixed(1)}" y="${y-7}" width="${w.toFixed(1)}" height="14" rx="2" fill="${col}" fill-opacity=".72" class="${pos?"growR":"growL"}" style="animation-delay:${(.1+i*.045).toFixed(2)}s;filter:drop-shadow(0 0 6px ${col})"><title>${h(d.k)}: students ${f2(d.st)}, staff ${f2(d.sf)}</title></rect>
      <text x="${(pos?cx+w+8:cx-w-8).toFixed(1)}" y="${y+5}" text-anchor="${pos?"start":"end"}" font-size="13" class="fadein" style="fill:${col};animation-delay:${(.8+i*.045).toFixed(2)}s">${pos?"+":"−"}${f2(Math.abs(d.d))}</text></g>`;
  });
  return `<svg class="hsvg" data-kind="diverging" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

/* 10. Rings on a slope: share with no career activity, by year */
function yearRings(){
  const ps=YEARS.map(y=>pct(D.yearExp[y].exp["None of the above"], D.yearExp[y].n)), W=700, H=500, r=52;
  const xs=YEARS.map((_,i)=>80+i*135), ys=ps.map(p=>100+(1-p/80)*270);
  let g=`<path d="M${xs.map((x,i)=>`${x} ${ys[i].toFixed(1)}`).join(" L")}" fill="none" stroke="${HOLO}" stroke-opacity=".5" stroke-width="2" stroke-dasharray="5 6" style="filter:drop-shadow(0 0 4px ${HOLO})" class="fadein"/>`;
  YEARS.forEach((yr,i)=>{

      <circle r="${r}" fill="#081422" stroke="rgba(114,226,255,.14)" stroke-width="9"/>

      <text y="9" text-anchor="middle" font-size="25" style="fill:#fff">${p}%</text>

/* 11. Glowing lines with light trails */
function lines(series, labels, o={}){
  const W=640, H=o.h||330, L=46, R=150, T=16, B=34, uid=++UID;
  const all=series.flatMap(s=>s.values);
  const min=Math.floor(Math.min(...all)*4)/4, max=Math.ceil(Math.max(...all)*4)/4;
  const x=i=>L+i*(W-L-R)/(labels.length-1), y=v=>T+(1-(v-min)/(max-min))*(H-T-B);
  let defs="", g="";
  for(let v=min; v<=max+1e-9; v+=.25) g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(114,226,255,.10)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="12">${v.toFixed(2)}</text>`;
  labels.forEach((l,i)=>{ g+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="12.5">${l}</text>`; });
  const ends=series.map(s=>({s,yy:y(s.values[s.values.length-1])})).sort((a,b)=>a.yy-b.yy);
  for(let i=1;i<ends.length;i++) if(ends[i].yy-ends[i-1].yy<16) ends[i].yy=ends[i-1].yy+16;
  series.forEach((s,si)=>{
    defs+=`<linearGradient id="lg${uid}_${si}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".32"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`;
    const d=s.values.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
    g+=`<path d="${d} L${x(s.values.length-1)} ${y(min)} L${x(0)} ${y(min)} Z" fill="url(#lg${uid}_${si})" class="fadein" style="animation-delay:${(.9+si*.1).toFixed(2)}s;opacity:${s.dim?.15:s.bold||series.length<3?1:.45}"/>`;
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.bold?3.4:2.2}" pathLength="1" class="draw" style="animation-delay:${(.2+si*.15).toFixed(2)}s;filter:drop-shadow(0 0 6px ${s.color});opacity:${s.dim?.3:1}"/>`;
    s.values.forEach((v,i)=>{ g+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===s.values.length-1?5:3.4}" fill="${s.color}" class="pop" style="animation-delay:${(1+i*.08+si*.1).toFixed(2)}s;opacity:${s.dim?.3:1}"><title>${h(s.name)} · ${labels[i]}: ${f2(v)}</title></circle>`; });
  });
  ends.forEach(e=>{ g+=`<text x="${W-R+10}" y="${e.yy+5}" font-size="13.5" style="fill:${e.s.color};opacity:${e.s.dim?.45:1}" class="fadein">${h(e.s.name)} ${f2(e.s.values[e.s.values.length-1])}</text>`; });
  return `<svg class="hsvg ${o.fixed?"fixed":""}" data-kind="lines" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><defs>${defs}</defs>${g}</svg>`;
}

/* 12. Radar (faculty profile and faculty comparisons) */
function radar(series, {lo=2.5, hi=5, hl=null, pos=[], neg=[]}={}){
  const N=SK.length, C=300, R=196, ang=i=>-Math.PI/2+i*2*Math.PI/N, rad=v=>Math.max(0,Math.min(1,(v-lo)/(hi-lo)))*R;
  let g="";
  for(let v=3; v<=hi+1e-9; v+=.5){ const r=rad(v); g+=`<circle cx="${C}" cy="${C}" r="${r}" class="rd-ring"/><text x="${C+4}" y="${C-r-3}" class="rd-rl">${v.toFixed(1)}</text>`; }
  SK.forEach((k,i)=>{
    const a=ang(i), on=hl&&hl.includes(k), c=Math.cos(a), s=Math.sin(a);
    g+=`<line x1="${C}" y1="${C}" x2="${C+c*R}" y2="${C+s*R}" class="rd-ax ${on?"on":""}"/>`;
    const anchor=Math.abs(c)<.2?"middle":c>0?"start":"end", dy=s>.6?14:s<-.6?-3:5, cls=on?"on":pos.includes(k)?"pos":neg.includes(k)?"neg":"";
    g+=`<g ${go_({view:"skill",skill:k,skills:[k],group:null})}><text x="${C+c*(R+14)}" y="${C+s*(R+14)+dy}" text-anchor="${anchor}" class="rd-lab ${cls}">${h(sn(k))}</text></g>`;
  });
  series.forEach((S,si)=>{
    const pts=SK.map((k,i)=>{ const r=rad(S.values[k]); return [C+Math.cos(ang(i))*r, C+Math.sin(ang(i))*r]; });
    const Pp=pts.map(p=>p.map(x=>x.toFixed(1)).join(",")).join(" ");
    if(S.dash) g+=`<polygon points="${Pp}" class="fadein" style="fill:none;stroke:${S.color};stroke-width:2;stroke-dasharray:6 5;animation-delay:${.5+si*.2}s;filter:drop-shadow(0 0 4px ${S.color})"/>`;
    else g+=`<polygon points="${Pp}" pathLength="1" class="draw rd-poly" style="color:${S.color};stroke:${S.color};fill:${S.fill?S.color:"none"};fill-opacity:${S.fill?.13:0};animation-delay:${.2+si*.25}s"/>`;
    if(!S.dash) pts.forEach((p,i)=>{ g+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${S.thin?3:4.2}" class="pop" style="fill:${S.color};animation-delay:${1+i*.035+si*.2}s;filter:drop-shadow(0 0 5px ${S.color})"><title>${h(S.name)} · ${h(SK[i])}: ${f2(S.values[SK[i]])}</title></circle>`; });
  });
  g+=`<g class="spinr" style="transform-origin:${C}px ${C}px;transform-box:view-box"><circle cx="${C}" cy="${C}" r="${R+40}" fill="none" stroke="rgba(114,226,255,.25)" stroke-dasharray="1 10" stroke-width="2"/></g>`;
  return `<svg class="hsvg radar" data-kind="radar" viewBox="-75 66 750 474" preserveAspectRatio="xMidYMid meet">${g}</svg>` + legend(series.map(S=>[S.color,S.name,S.dash]).concat([["transparent",`Scale ${lo}–${hi}`]]));
}

/* 13. Lollipops (used for focus skills on a faculty) */
function lolli(rows, {lo=2, hi=5}={}){
  const LW=170, W=640, VW=56, RH=27, top=6, cw=W-LW-VW, x=v=>LW+(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*cw, H=top+rows.length*RH+24;
  let g="";
  for(let v=Math.ceil(lo*2)/2; v<=hi+1e-9; v+=.5) g+=`<line x1="${x(v)}" x2="${x(v)}" y1="${top}" y2="${H-20}" stroke="rgba(114,226,255,.12)" stroke-dasharray="2 4"/><text x="${x(v)}" y="${H-5}" text-anchor="middle" font-size="12">${v.toFixed(1)}</text>`;
  rows.forEach((r,i)=>{ const y=top+i*RH+RH/2, c=r.color||HOLO;
    g+=`<text x="${LW-12}" y="${y+5}" text-anchor="end" font-size="14.5" style="fill:#B9D3E2">${h(r.label)}</text>
      <line x1="${LW}" x2="${x(r.v)}" y1="${y}" y2="${y}" stroke="${c}" stroke-opacity=".55" stroke-width="2" pathLength="1" class="draw" style="animation-delay:${.15+i*.05}s"/>
      ${r.ref!=null?`<line x1="${x(r.ref)}" x2="${x(r.ref)}" y1="${y-8}" y2="${y+8}" stroke="${GOLD}" stroke-width="2"/>`:""}
      ${r.staff!=null?`<rect x="${x(r.staff)-5}" y="${y-5}" width="10" height="10" transform="rotate(45 ${x(r.staff)} ${y})" fill="#050E1A" stroke="${RED}" stroke-width="2"><title>Staff rating: ${STAFF[r.staff]}</title></rect>`:""}
      <circle cx="${x(r.v)}" cy="${y}" r="6" fill="${c}" class="pop" style="animation-delay:${.6+i*.05}s;filter:drop-shadow(0 0 6px ${c})"/>
      <text x="${W-4}" y="${y+5}" text-anchor="end" font-size="14" style="fill:${c}">${f2(r.v)}</text>`; });
  return `<svg class="hsvg fixed" data-kind="lolli" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

/* 14. Heatmap (every faculty × every skill) */
function heat(skills){
  const cols=`minmax(9.5em,${skills.length<6?17:13}em) repeat(${skills.length}, minmax(2.2em,1fr))`;
  let g=`<div class="hm" style="grid-template-columns:${cols}"><span></span>${skills.map(k=>`<span class="h">${h(sn(k))}</span>`).join("")}`, n=0;
  CODES.forEach(c=>{
    g+=`<span class="rl" ${go_({view:"faculty",fac:c,skills:[],group:null})} title="${h(fname(c))}">${h(fs_(c))} <small>${F[c].n}</small></span>`;
    skills.forEach(k=>{ const v=F[c].means[k], d=v-D.overall[k], a=Math.min(1,Math.abs(d)/.5);
      const bg=d>=0?`rgba(114,226,255,${(.06+a*.62).toFixed(2)})`:`rgba(255,90,95,${(.06+a*.62).toFixed(2)})`;
      g+=`<span class="c" style="background:${bg};color:${a>.6?"#050E1A":"#E8F4FA"};animation-delay:${(n++%400)*4+100}ms" title="${h(fname(c))} · ${h(k)}: ${f2(v)} (all students ${f2(D.overall[k])})" ${go_({view:"faculty",fac:c,skills:[k],group:null})}>${v.toFixed(1)}</span>`; });
  });
  g+=`<span class="rl" style="color:#fff">All students <small>${D.n}</small></span>${skills.map(k=>`<span class="c" style="background:rgba(255,255,255,.08);animation-delay:600ms">${D.overall[k].toFixed(1)}</span>`).join("")}</div>`;
  return `<div class="hm-wrap" data-kind="heat">${g}</div><div class="hscale"><span>0.5 below average</span><span class="g"></span><span>0.5 above average</span></div>`;
}

/* ---------- data helpers ---------- */
function needsData(){
  const want={}, gap={};
  FORM_CODES.forEach(c=>{ F[c].form.wantMore.forEach(w=>want[w]=(want[w]||0)+1); F[c].form.gaps.forEach(g=>gap[g]=(gap[g]||0)+1); });
  return {want:Object.entries(want).sort((a,b)=>b[1]-a[1]), gap:Object.entries(gap).sort((a,b)=>b[1]-a[1])};
}
function percData(c){
  const cs=c?[c]:FORM_CODES;
  return SK.map(k=>{ const s=mean(cs.map(x=>F[x].means[k])), f=mean(cs.map(x=>F[x].form.ratings[k])); return {k,st:s,sf:f,d:s-f}; });
}
const facChips = form => `<div class="kk">Biggest gaps, per staff</div><div class="chips">${form.gaps.map(g=>`<span class="chipx red">${h(sn(g))}</span>`).join("")||'<span class="chipx">None named</span>'}</div><div class="kk">Wants more of</div><div class="chips">${form.wantMore.slice(0,5).map(g=>`<span class="chipx cy">${h(g)}</span>`).join("")}</div>`;

/* ---------- views: left hologram, right readouts ---------- */
const V = {};
function ovFocus(){
  if(st.focus) return st.focus;
  const q=st.q||"", lowQ=/\b(weak\w*|worst|lowest|bottom|least|struggl\w*|need\w* (?:\w+ )?(?:help|work|improv\w*|support)|improve\w*|improving|develop\w*|gaps?|lacking|behind|work on)\b/.test(q), topQ=/\b(top|best|strongest|highest|leading|good at|most confident|strengths?)\b/.test(q);
  if(lowQ&&!topQ) return {dir:"bottom", n:3}; if(topQ&&!lowQ) return {dir:"top", n:3}; return null;
}
V.overview = () => {
  const fo=ovFocus();

  ["Digital & AI",/digital|tech\w* skills|\btech\b|technology/],

function grab(t, list){ const hits=[]; for(const [k,rx] of list){ if(new RegExp(rx.source).test(t)){ hits.push(k); t=t.replace(new RegExp(rx.source,"g")," "); } } return [hits,t]; }
function parse(raw){
  let t=" "+raw.toLowerCase().replace(/[’']/g,"'").replace(/[?!.,]/g," ")+" ";
  const full=t;

  let cls, facs, skills;
  [cls,t]=grab(t,CL_RX); [facs,t]=grab(t,FAC_RX); [skills,t]=grab(t,SKILL_RX);
  let group=null; for(const [k,rx] of GROUP_RX){ if(rx.test(t)){ group=k; break; } }
  // drop the presenter's own phrasing ("I want to see…", "can you show me…") so it isn't mistaken for a topic
  const q=full.replace(/\b(?:i|we)(?:'d| would)? (?:want|like|wish|need)(?: to)?(?: (?:see|look at|show|view|hear|know|have a look at|get))?\b/g," ")
    .replace(/\b(?:can|could|would) you\b|\bplease\b|\bshow me\b|\blet me see\b|\btell me\b|\bgive me\b|\btake me to\b|\bpull up\b|\bbring up\b/g," ");
  const has=rx=>rx.test(q);
  const mapQ=/\bheat ?map\b|\bthe grid\b|\bgrid\b|\btable\b|\bmatrix\b|\bdetailed map\b|\bfull map\b|\bevery faculty (?:and|against|by) every skill|\bskill by skill\b/.test(q);
  const mapping=/\bskills? ?map(?:ping)?\b|\bmapping\b|\bmap of (?:the )?(?:skills|university|faculties)|\b(?:university|faculty) map\b/.test(q);
  const galQ=/\bacross (?:the |all |all the |every |our )?(?:whole |entire )?(?:university|bue|campus|faculties|faculty|schools)\b|\buniversity[- ]wide\b|\b(?:whole|entire) university\b|\bat a glance\b|\bgalaxy\b|\bconstellation\b|\bnetwork\b|\b(?:all|every|each) (?:the )?facult(?:y|ies)\b|\bby faculty\b|\bwhich facult/.test(q);
  const allCl=has(/\bclusters\b|\ball (?:three |3 )?clusters?\b|\beach cluster\b|\bby cluster\b/);
  const perception=has(/percep|staff|lecturer|academics|faculty (?:think|view|rat|see|say)|agree|self[- ]?rat|overestimat|overconfiden|reality|mismatch|align|see the same/);
  const needs=has(/\bfacult(?:y|ies)\b[^.]*\b(?:want|need|ask|request)|faculty needs|what (?:do|are) (?:the )?faculties|\bchallenges\b|start doing|what should (?:we|the career cent(?:re|er)|cc) (?:do|start|provide|offer)/);
  const expQ=has(/experienc|attended|been to|participat|taken part|career fairs?|internships?|activities|engag/);
  const years=has(/\byears? (?:of study|one|two|three|four|five|[1-5])\b|\bby year\b|year on year|year by year|progress|over time|\bgrow|cohort|first[- ]?years?|final[- ]?years?|fourth[- ]?years?|seniors|freshm/);
  const voice=has(/\b(?:what|which) (?:do |would |did )?(?:our |the )?students (?:want|wish|need|ask|say|like)|\bstudents? (?:want|wish|asked? for|are asking|would like|said)|\bstudent voice|in their own words|\bquotes?\b|what (?:are|were) students asking/);
  const over=has(/\btop\b|best|strong|weak|help|gaps?|lowest|highest|overview|summary|home|reset|struggl|improve|overall|bue students|show me (?:the )?skills|^ *skills *$/);
  if(mapQ && !cls.length && !facs.length) return {view:"heat", group, skills:skills.length>1?skills:[]};
  if((galQ||mapping) && !cls.length && !facs.length && !needs && !perception && !voice && !expQ) return {view:"galaxy", group, skills};
  if(allCl || cls.length>=2) return {view:"clusters", cls:cls.length>=2?cls:CLK.slice(), skills, group};
  if(cls.length===1) return {view:"cluster", cl:cls[0], skills, group};
  if(facs.length>=2) return {view:"compare", facs, skills, group};
  if(perception) return facs[0]&&F[facs[0]].form ? {view:"perception", fac:facs[0], percFac:true, skills, group} : {view:"perception", percFac:false, skills, group};
  if(voice && !needs) return {view:"voice"};
  if(needs && !facs.length) return {view:"needs"};
  if(expQ && !voice) return {view:"experience", expFac:facs[0]||null};
  if(years && !facs.length) return {view:"years", skills, group};
  if(facs.length===1) return {view:"faculty", fac:facs[0], skills, group};
  if(voice && !skills.length) return {view:"voice"};
  if(skills.length===1 && !group) return {view:"skill", skill:skills[0], skills, group:null};
  if(group && !skills.length) return {view:"skill", group, skills:[]};
  if(skills.length>1) return {view:"galaxy", skills, group:null};

}

const BUE_Y1=pct(D.years["Year 1"].n, D.n);
function yearMix(codes){ const t={}; let n=0; codes.forEach(c=>Object.entries(F[c].yearN||{}).forEach(([y,k])=>{ t[y]=(t[y]||0)+k; n+=k; })); return {t,n}; }

function whyAnswer(A, skills, asked){

  const {t,n}=yearMix(codes), fy=Math.round((t["Year 1"]||0)/n*100), late=Math.round(((t["Year 4"]||0)+(t["Year 5"]||0))/n*100);
  const act=gm(A.means,sk), exp=expected(codes,sk), adj=act-exp, bue=gm(D.overall,sk), weak=asked==="weak"||(asked!=="strong"&&act<bue);
  const d=sk.map(k=>({k,d:A.means[k]-D.overall[k]})).sort((a,b)=>weak?a.d-b.d:b.d-a.d).slice(0,3).filter(x=>weak?x.d<0:x.d>0);
  const on=skills&&skills.length?" on "+listJoin(skills.map(sl)):"";

  if(skills&&skills.length&&asked==="weak"&&act>bue+.03) s+=`Actually, ${A.say} isn't weak${on}: it's ${rel(act-bue)} the university average. `;
  if(skills&&skills.length&&asked==="strong"&&act<bue-.03) s+=`Actually, ${A.say} isn't strong${on}: it's ${rel(act-bue)} the university average. `;

  else s+= adj<-.05 ? `Allowing for that, it still sits below where its year mix predicts${on}, so it's not just the cohort. ` : adj>.05 ? `Allowing for that, it still sits above where its year mix predicts${on}, so the faculty itself is adding something. ` : `Allowing for that, it's about where its year mix predicts${on}. `;
  if(d.length) s+=`${weak?"The biggest gaps are":"Its biggest leads are"} ${listJoin(d.map(x=>sl(x.k)))}.`;
  if(A.kind==="fac" && F[A.key].form && F[A.key].form.gaps.length && weak) s+=` Its lecturers point to ${listJoin(F[A.key].form.gaps.map(sl))}.`;

  s=s.replace(/\s+/g," ").trim();

}
function whoPanel(codes){

/* gaps between two subjects, in either direction */
function gapAnswer(A, B, worse){
  const d=SK.map(k=>({k,d:A.means[k]-B.means[k]}));
  const list=worse ? d.filter(x=>x.d<-.02).sort((a,b)=>a.d-b.d) : d.filter(x=>x.d>.02).sort((a,b)=>b.d-a.d);
  const hl=list.slice(0,6).map(x=>x.k);
  let patch;
  if(A.kind==="fac" && B.kind==="fac") patch={view:"compare", facs:[A.key,B.key]};
  else if(A.kind==="cl" && B.kind==="cl") patch={view:"clusters", cls:[A.key,B.key]};
  else if(A.kind==="fac") patch={view:"faculty", fac:A.key};
  else patch={view:"cluster", cl:A.key};
  Object.assign(patch,{hl:hl.length?hl:null, skills:[], group:null});
  const AS=cap(A.say);
  if(!list.length){
    const s=d.slice().sort((a,b)=>worse?a.d-b.d:b.d-a.d)[0];
    return {patch, show:`${A.name} ${worse?"doesn't trail":"isn't ahead of"} ${B.name} on any skill`,
      say: worse ? `${AS} doesn't trail ${B.say} on any skill. Its narrowest lead is ${sl(s.k)}.` : `${AS} isn't ahead of ${B.say} on any skill. It comes closest on ${sl(s.k)}.`};
  }
  const top=list.slice(0,3).map(x=>sl(x.k)), more=list.length-3;
  const tail=more>0?`, and ${more} other skill${more>1?"s":""}`:"";
  return {patch,
    show:`${A.name} ${worse?"behind":"ahead of"} ${B.name} on: ${list.slice(0,4).map(x=>sn(x.k)).join(" · ")}`,
    say: worse ? `${AS} trails ${B.say} on ${listJoin(top)}${tail}. The biggest gap is ${sl(list[0].k)}.`

function genderAnswer(t, e){

  }

  }
  return {patch, show:`Gender${where}: ${fs}% female · ${100-fs}% male · ${us}% unclear`, say:`${where?cap(where.trim())+", about":"About"} ${fs} percent of students are female and ${100-fs} percent male, based on the names we can classify. About ${us} percent have names that could be either, so they're left out.${est}`};

  const target=t.replace(/[^a-z0-9& ]/g," ").replace(ZSTOP," ").replace(/\s+/g," ").trim();
  const tc=cmp(target), toks=target.split(" ").filter(w=>w.length>=3);
  let best=null, bs=0;
  panels().forEach(p=>{
    const title=p.querySelector("h3").textContent.toLowerCase(), titleC=cmp(title), words=title.split(/[^a-z0-9]+/).filter(w=>w.length>=4);
    let s=0;
    if(tc.length>=4 && titleC.includes(tc)) s+=20;                                   // whole name, spaces ignored ("stand outs" = "standouts")
    words.forEach(w=>{ if(tc.includes(w) || (w.length>=5 && tc.length>=5 && (w.startsWith(tc.slice(0,5)) || tc.includes(w.slice(0,6))))) s+=6; });
    toks.forEach(k=>{ if(k.length>=4 && titleC.includes(cmp(k))) s+=4; });
    (KIND_WORDS[p.dataset.kind]||[]).forEach(w=>{ if(new RegExp("\\b"+w+"\\b").test(t)) s+=w.length/2; });
    if(/\b(left|main|big(?:gest)?|large)\b/.test(t) && p.closest("#mapBox")) s+=3;
    if(/\b(right|side)\b/.test(t) && p.closest("#side")) s+=3;
    if(s>bs){ bs=s; best=p; }
  });
  if(best) return best;
  return toks.length ? null : panels().find(p=>p.closest("#mapBox"));   // "blow it up" with nothing named: the main diagram
}
function zoom(panel, speakIt=true){
